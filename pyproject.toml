[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-audiobook"
version = "0.1.0"
description = "自动化有声书生成引擎 — EPUB/MOBI/PDF 转结构化 MP3"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pydub>=0.25",
    "mutagen>=1.47",
    "watchdog>=4.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "questionary>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "idna>=3.15",
]

[project.scripts]
auto-audiobook = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "parser",
    "cleaner",
    "rule_cleaner",
    "synthesizer",
    "assembler",
    "pipeline",
    "text_processor",
    "voice_profiles",
    "models",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N806"]

[tool.mypy]
ignore_missing_imports = true
